name: Build and Send APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Install Android platform
        run: cordova platform add android

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: "8987975831:AAHBBu-GQqf75JRlNe5rOpF3oTjND0fMQg0"
          TELEGRAM_CHAT_ID: "8489426487"
        run: |
          APK_PATH="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          curl -v -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=📱 APK успешно собран в облаке GitHub и доставлен!"
