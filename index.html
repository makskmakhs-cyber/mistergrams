<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <title>Mistergrams - Sign In</title>
    <style>
        body {
            background-color: #0e1621;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 320px;
            padding: 20px;
        }
        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px auto;
        }
        .avatar-placeholder {
            width: 90px;
            height: 90px;
            background-color: #2b5278;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 {
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 22px;
        }
        p {
            color: #899ab5;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .input-group {
            background-color: #17212b;
            border: 1px solid #232e3c;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        select, input {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        select {
            border-bottom: 1px solid #232e3c;
            color: #f5f5f5;
        }
        select option {
            background-color: #17212b;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5288c1;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        button:active {
            background-color: #4072a7;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Экран 1: Ввод номера -->
        <div id="step-phone">
            <div class="avatar-container">
                <div class="avatar-placeholder">📞</div>
            </div>
            <h2>Sign in to Telegram</h2>
            <p>Please confirm your country code and enter your phone number.</p>
            
            <div class="input-group">
                <select id="country">
                    <option value="+7">Russia (+7)</option>
                    <option value="+380" selected>Ukraine (+380)</option>
                    <option value="+1">USA (+1)</option>
                    <option value="+44">United Kingdom (+44)</option>
                </select>
                <input type="tel" id="phone" placeholder="Phone number">
            </div>

            <button onclick="goToCodeScreen()">Next</button>
        </div>

        <!-- Экран 2: Ввод кода из SMS -->
        <div id="step-code" class="hidden">
            <div class="avatar-container">
                <div class="avatar-placeholder">✉️</div>
            </div>
            <h2>Enter Code</h2>
            <p>We have sent an SMS with the code to your phone.</p>
            
            <div class="input-group">
                <input type="text" id="code" placeholder="Code from bot / SMS">
            </div>

            <button onclick="verifyCode()">Confirm</button>
        </div>
    </div>

    <script>
        function goToCodeScreen() {
            var phone = document.getElementById('phone').value;
            if(phone.trim() === '') {
                alert('Please enter your phone number');
            } else {
                document.getElementById('step-phone').classList.add('hidden');
                document.getElementById('step-code').classList.remove('hidden');
            }
        }

        function verifyCode() {
            var code = document.getElementById('code').value;
            if(code.trim() === '') {
                alert('Please enter the code');
            } else {
                alert('Success! Logging in...');
            }
        }
    </script>
</body>
</html>
